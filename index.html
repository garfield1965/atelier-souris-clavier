<!DOCTYPE html>
<html lang="fr">
<head>

<link rel="icon" href="ressources/familles/souris.svg">

<body>

<header>
  <div class="marque"><span>Atelier</span> souris et clavier</div>
  <input id="prenom" placeholder="Votre prénom" maxlength="14" aria-label="Votre prénom">
  <div class="compteur" id="compteur">0 point</div>
  <button class="bouton" id="btn-son">Son activé</button>
  <button class="bouton" id="btn-accueil" hidden>Accueil</button>
</header>

<main id="racine"></main>
<canvas id="confettis" hidden></canvas>
